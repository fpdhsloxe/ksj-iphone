<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>강신재의 아이폰</title>
  <meta property="og:title" content="강신재의 아이폰">
  <meta property="og:description" content="휴대폰을 직접 켜서 확인해 보세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    body {
      min-height: 100vh;
      background: #7d8086;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      color: #fff;
      overflow: hidden
    }

    #caption {
      font-size: 13px;
      opacity: .75
    }

    #off-btn {
      background: rgba(0, 0, 0, .35);
      color: #fff;
      border: 0;
      border-radius: 18px;
      padding: 8px 18px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      visibility: hidden
    }

    #off-btn.show {
      visibility: visible
    }

    #phone {
      position: relative;
      width: 393px;
      height: 852px;
      border-radius: 56px;
      background: #000;
      box-shadow: 0 0 0 10px #1d1d1f, 0 30px 60px rgba(0, 0, 0, .45);
      overflow: hidden
    }

    #screen {
      position: absolute;
      inset: 0;
      background: #000;
      overflow: hidden;
      border-radius: 56px
    }

    .scr {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
      overflow: hidden
    }

    .scr.on {
      display: block
    }

    #s-off.on,
    #s-boot.on {
      display: flex
    }

    #status {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 34px 0 46px;
      font-size: 16px;
      font-weight: 700;
      pointer-events: none
    }

    #island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 51;
      pointer-events: none
    }

    #home-ind {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      border-radius: 3px;
      background: #fff;
      z-index: 50;
      pointer-events: none
    }

    #s-off {
      background: #000;
      align-items: center;
      justify-content: center;
      cursor: pointer
    }

    #s-off .hint {
      font-size: 14px;
      letter-spacing: .5px;
      animation: breath 2.8s ease-in-out infinite
    }

    @keyframes breath {

      0%,
      100% {
        opacity: .15
      }

      50% {
        opacity: .45
      }
    }

    #s-boot {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: #000
    }

    .ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    #s-boot .owner {
      font-size: 20px;
      font-weight: 700
    }

    #s-lock {
      background: linear-gradient(160deg, #1f2a44, #0e1220 55%, #1b1426)
    }

    #s-lock.buzz {
      animation: buzz .3s linear
    }

    @keyframes buzz {

      0%,
      100% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(.4px)
      }

      75% {
        transform: translateX(-.4px)
      }
    }

    #lock-main {
      position: absolute;
      inset: 0
    }

    #lock-date {
      position: absolute;
      top: 70px;
      width: 100%;
      text-align: center;
      font-size: 17px;
      font-weight: 500
    }

    #lock-time {
      position: absolute;
      top: 92px;
      width: 100%;
      text-align: center;
      font-size: 84px;
      font-weight: 500;
      letter-spacing: -2px;
      line-height: 1
    }

    #notifs {
      position: absolute;
      top: 250px;
      left: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .notif {
      background: rgba(60, 60, 66, .85);
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 14px;
      flex-shrink: 0
    }

    .notif.new {
      animation: cardin .45s cubic-bezier(.2, .8, .2, 1)
    }

    @keyframes cardin {
      from {
        opacity: 0;
        transform: translateY(-26px) scale(.97)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .notif .na {
      font-size: 12px;
      color: #c9c9cf;
      display: flex;
      justify-content: space-between
    }

    .notif .nt {
      font-weight: 700;
      margin-top: 3px;
      font-size: 15px
    }

    .notif .nb {
      color: #e4e4ea;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    #summary {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 120px;
      display: none;
      flex-direction: column;
      gap: 8px;
      font-size: 13px
    }

    #summary.show {
      display: flex
    }

    #summary .sg {
      background: rgba(60, 60, 66, .7);
      border-radius: 14px;
      padding: 10px 14px
    }

    #summary .more {
      text-align: center;
      color: #ddd;
      font-size: 13px;
      margin-top: 4px
    }

    #lock-foot {
      position: absolute;
      bottom: 44px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      opacity: .7
    }

    #lock-tap {
      position: absolute;
      inset: 0;
      cursor: pointer;
      display: none
    }

    #pass-view {
      position: absolute;
      inset: 0;
      display: none
    }

    #pass-view.on {
      display: block
    }

    #pass-title {
      position: absolute;
      top: 130px;
      width: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: 500
    }

    #dots {
      position: absolute;
      top: 185px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 18px
    }

    #dots span {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #fff
    }

    #dots span.f {
      background: #fff
    }

    #dots.shake {
      animation: shake .4s
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-10px)
      }

      40% {
        transform: translateX(10px)
      }

      60% {
        transform: translateX(-7px)
      }

      80% {
        transform: translateX(5px)
      }
    }

    #pass-msg {
      position: absolute;
      top: 226px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #ff8f8f;
      min-height: 18px
    }

    #pass-hint {
      position: absolute;
      top: 250px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #e8e8ee
    }

    #keys {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 78px);
      gap: 16px 22px
    }

    #keys button {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .16);
      color: #fff;
      font-size: 30px;
      font-family: inherit;
      cursor: pointer
    }

    #keys button:active {
      background: rgba(255, 255, 255, .4)
    }

    #keys .blank {
      visibility: hidden
    }

    #s-home {
      background: linear-gradient(150deg, #2b3a67 0%, #16324a 45%, #3b2250 100%)
    }

    #widget {
      position: absolute;
      top: 82px;
      left: 20px;
      right: 20px;
      height: 150px;
      border-radius: 24px;
      background: rgba(20, 20, 24, .45);
      padding: 16px;
      overflow: hidden
    }

    #widget .wt {
      font-size: 46px;
      font-weight: 500;
      line-height: 1
    }

    #widget .wd {
      font-size: 14px;
      margin-top: 4px
    }

    #widget .ww {
      position: absolute;
      right: 16px;
      top: 16px;
      text-align: right;
      font-size: 14px;
      font-weight: 500
    }

    #widget .ww b {
      display: block;
      font-size: 22px
    }

    #grid {
      position: absolute;
      top: 270px;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: 26px;
      padding: 0 20px;
      justify-items: center
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .5)
    }

    .ico {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3)
    }

    .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      background: #ff3b30;
      color: #fff;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      font-weight: 700
    }

    .badge.show {
      display: flex
    }

    #wfx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s;
      overflow: hidden
    }

    #wfx.on {
      opacity: 1
    }

    #wfx .sun {
      position: absolute;
      top: 60px;
      right: 60px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #ffd60a;
      box-shadow: 0 0 40px #ffd60a;
      animation: rise 2.5s ease-out forwards
    }

    @keyframes rise {
      from {
        transform: translateY(80px) rotate(0)
      }

      to {
        transform: translateY(0) rotate(180deg)
      }
    }

    #wfx .cloud {
      position: absolute;
      top: 150px;
      left: -160px;
      width: 130px;
      height: 44px;
      border-radius: 30px;
      background: rgba(255, 255, 255, .75);
      animation: drift 2.5s linear forwards
    }

    @keyframes drift {
      to {
        transform: translateX(560px)
      }
    }

    #s-app {
      background: #000;
      flex-direction: column
    }

    #app-head {
      height: 100px;
      padding: 52px 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
      font-weight: 700;
      font-size: 17px;
      flex-shrink: 0
    }

    #app-back {
      background: none;
      border: 0;
      color: #0a84ff;
      font-size: 17px;
      font-family: inherit;
      cursor: pointer;
      padding: 4px 8px;
      min-width: 60px;
      text-align: left
    }

    #app-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 1.4em 20px;
      min-height: 0
    }

    .row {
      padding: 14px 0;
      border-bottom: 1px solid #1c1c1e;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .row .rt {
      font-weight: 700;
      font-size: 15px
    }

    .row .rs {
      font-size: 13px;
      color: #8e8e93;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px
    }

    .row .rd {
      font-size: 12px;
      color: #8e8e93;
      flex-shrink: 0
    }

    .ub {
      background: #0a84ff;
      color: #fff;
      border-radius: 10px;
      font-size: 12px;
      padding: 1px 7px;
      margin-left: 6px;
      font-weight: 700
    }

    .sep {
      text-align: center;
      font-size: 12px;
      color: #8e8e93;
      margin: 16px 0 10px
    }

    .bub {
      max-width: 70%;
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
      margin: 2px 0
    }

    .bub.in {
      background: #3a3a3c;
      color: #fff;
      align-self: flex-start;
      border-bottom-left-radius: 6px
    }

    .bub.out {
      background: #0a84ff;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 6px
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 12px
    }

    .tm {
      font-size: 11px;
      color: #8e8e93;
      margin: 0 4px 6px
    }

    .tm.r {
      text-align: right
    }

    .tm.l {
      text-align: left
    }

    .kb {
      max-width: 72%;
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all
    }

    .kb.in {
      background: #4a4a4e;
      color: #fff
    }

    .kb.out {
      background: #fee500;
      color: #111
    }

    .kb.del {
      background: transparent;
      color: #8e8e93;
      font-style: italic;
      border: 1px dashed #555
    }

    .kr {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      margin: 4px 0
    }

    .kr.mine {
      justify-content: flex-end
    }

    .kr .kt {
      font-size: 10px;
      color: #8e8e93;
      white-space: nowrap
    }

    .kr .react {
      font-size: 12px;
      background: #2c2c2e;
      border-radius: 10px;
      padding: 1px 6px
    }

    .kname {
      font-size: 12px;
      color: #c9c9cf;
      margin: 6px 0 2px 46px
    }

    .locbox {
      padding: 0;
      overflow: hidden;
      width: 200px
    }

    .locbox .map {
      height: 90px;
      background: linear-gradient(135deg, #3a6b4f, #7fb38f)
    }

    .locbox .lt {
      padding: 8px 10px;
      font-size: 13px;
      color: #111
    }

    .typing {
      align-self: flex-start;
      margin: 6px 0 0 46px;
      background: #4a4a4e;
      border-radius: 14px;
      padding: 8px 12px;
      color: #bbb;
      font-size: 13px
    }

    #kk-choice {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      margin: 8px 0
    }

    #kk-choice button {
      background: #2c2c2e;
      color: #fee500;
      border: 1px solid #fee500;
      border-radius: 18px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer
    }

    #kk-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 28px;
      background: #1c1c1e;
      border-top: 1px solid #333;
      position: relative;
      flex-shrink: 0
    }

    #kk-bar.on {
      display: flex
    }

    #kk-plus {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #3a3a3c;
      border: 0;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      flex-shrink: 0
    }

    #kk-plus.blink {
      animation: blink 1s infinite
    }

    @keyframes blink {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(254, 229, 0, .9)
      }

      50% {
        box-shadow: 0 0 0 5px rgba(254, 229, 0, 0)
      }
    }

    #kk-text {
      flex: 1;
      height: 34px;
      border-radius: 17px;
      background: #2c2c2e;
      color: #8e8e93;
      font-size: 14px;
      display: flex;
      align-items: center;
      padding: 0 12px
    }

    #kk-menu {
      position: absolute;
      left: 12px;
      bottom: 74px;
      background: #2c2c2e;
      border-radius: 14px;
      overflow: hidden;
      display: none;
      min-width: 170px;
      z-index: 5
    }

    #kk-menu.on {
      display: block
    }

    #kk-menu div {
      padding: 12px 16px;
      border-bottom: 1px solid #3a3a3c;
      font-size: 15px;
      cursor: pointer
    }

    .mini {
      font-size: 12px;
      color: #8e8e93;
      padding: 10px 0
    }

    .call-ico {
      font-size: 14px;
      margin-right: 6px
    }

    .call-ico.miss {
      color: #ff453a
    }

    /* ===== 2차: 전화 화면 · 배너 ===== */
    .call-view {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      padding-top: 150px;
      gap: 14px;
      background: linear-gradient(170deg, #3a3f4b, #0b0c10)
    }

    .call-view.on {
      display: flex
    }

    #s-call {
      background: #0b0c10
    }

    .c-av {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #8a8f99;
      font-size: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700
    }

    .c-av.pulse {
      animation: pulse 1.6s infinite
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 255, 255, .45)
      }

      100% {
        box-shadow: 0 0 0 46px rgba(255, 255, 255, 0)
      }
    }

    .c-name {
      font-size: 28px;
      font-weight: 500
    }

    .c-sub {
      font-size: 15px;
      color: #c9c9cf
    }

    .c-line {
      margin-top: 30px;
      font-size: 18px;
      text-align: center;
      padding: 0 30px;
      min-height: 60px;
      line-height: 1.5
    }

    .c-btns {
      position: absolute;
      bottom: 70px;
      display: flex;
      gap: 70px
    }

    .cb {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 0;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer
    }

    .cb.red {
      background: #ff3b30
    }

    .cb.green {
      background: #30d158
    }

    #c-end.dim {
      opacity: .25
    }

    #call-ring.outgoing #c-acc {
      display: none
    }

    #banner {
      position: absolute;
      top: 58px;
      left: 12px;
      right: 12px;
      background: rgba(60, 60, 66, .96);
      border-radius: 16px;
      padding: 10px 14px;
      z-index: 60;
      transform: translateY(-220%);
      opacity: 0;
      pointer-events: none;
      transition: transform .35s, opacity .35s;
      cursor: pointer;
      font-size: 13px
    }

    #banner.show {
      transform: none;
      opacity: 1;
      pointer-events: auto
    }

    #banner b {
      display: block;
      font-size: 14px;
      margin-bottom: 2px
    }

    #wfx .sun,
    #wfx .cloud {
      animation-play-state: paused
    }

    #wfx.on .sun,
    #wfx.on .cloud {
      animation-play-state: running
    }

    /* ===== 디자인 수정: 아이폰 홈·잠금 스타일 ===== */
    #s-home {
      background: radial-gradient(circle at 20% 15%, #6d6d72 0, transparent 45%), radial-gradient(circle at 80% 70%, #2c2c30 0, transparent 55%), radial-gradient(circle at 30% 90%, #4a4a50 0, transparent 50%), #18181b
    }

    #s-lock {
      background: radial-gradient(circle at 30% 20%, #3b3b3f, #000 70%)
    }

    #status {
      font-weight: 600;
      letter-spacing: .2px
    }

    #widget {
      top: 70px;
      left: 16px;
      right: 16px;
      height: 150px;
      border-radius: 26px;
      background: rgba(40, 40, 44, .55);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, .08)
    }

    #widget .wt {
      font-size: 58px;
      font-weight: 300
    }

    #grid {
      top: 262px;
      row-gap: 22px;
      padding: 0 14px
    }

    .ico {
      width: 62px;
      height: 62px;
      border-radius: 15px;
      font-size: 28px;
      box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .15), 0 2px 8px rgba(0, 0, 0, .25)
    }

    .app {
      font-size: 12px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .4)
    }

    .home-search {
      position: absolute;
      bottom: 44px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      border-radius: 20px;
      background: rgba(70, 70, 74, .7);
      backdrop-filter: blur(20px);

    /* ---------- 카톡 ---------- */

    function rowHtml(m, first, name) {
      if (m[0] === 'date') return `<div class="sep">${m[1]}</div>`;
      const [time, dir, text, , react] = m;
      if (dir === 'del') return '<div class="kr"><div class="kb del">삭제된 메시지입니다</div></div>';
      const mine = dir === 'out';
      const body = text === 'loc'
        ? '<div class="kb out locbox"><div class="map"></div><div class="lt">📍 내 위치 · 평창동</div></div>'
        : `<div class="kb ${mine ? 'out' : 'in'}">${text}</div>`;
      const t = `<span class="kt">${time}</span>`;
      const r = react ? `<span class="react">${react}</span>` : '';
      if (mine) return `<div class="kr mine">${t}${body}${r}</div>`;
      const av = first ? `<div class="ph"></div>` : '<div class="ph-spacer"></div>';
      const nm = first && name ? `<div class="kname">${name}</div>` : '';
      return `<div class="kin">${av}<div class="kcol">${nm}<div class="kr">${body}${t}${r}</div></div></div>`;
    }


    function isKkView(i) {
      return st.view === 'thread' && st.app === 'kakao' && st.kk === i;
    }

    function addMsg(i, m) {
      if (Array.isArray(i)) { m = i; i = 0; }
      const th = DATA.kakao[i];
      th.msgs.push(m);
      if (isKkView(i)) {
        const prev = th.msgs[th.msgs.length - 2];
        const first = !prev || prev[0] === 'date' || prev[1] !== m[1] || prev[3] !== m[3];
        $('app-body').insertAdjacentHTML('beforeend', rowHtml(m, first, th.group ? m[3] : th.who));
        scrollBottom();
      } else if (m[1] === 'in') {
        th.unread++;
        badges();
        banner(th.who, m[2], () => openKakao(i));
      }
    }

    function typingHtml(name) {
      return `<div class="tyg" id="kk-typing">
    <div class="tav"><svg width="24" height="24" viewBox="0 0 24 24" fill="#eef4fc"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></div>
    <div class="tcol"><div class="tnm">${name}</div><div class="tbub"><i></i><i></i><i></i></div></div>
  </div>`;
    }

    async function say(i, text) {
      if (typeof i === 'string') { text = i; i = 0; }
      if (isKkView(i)) {
        $('app-body').insertAdjacentHTML('beforeend', typingHtml(DATA.kakao[i].who));
        scrollBottom();
      }
      await wait(350 + Math.random() * 350);
      const t = $('kk-typing');
      if (t) t.remove();
      addMsg(i, [DATA.time, 'in', text]);
    }


    function choose(i, opts) {
      return new Promise(res => {
        T.pending = T.pending || {};
        T.pending[i] = { opts, res };
        renderChoice();
      });
    }

    function renderChoice() {
      const room = st.kk;
      const p = T.pending && T.pending[room];
      if (!p || !isKkView(room)) return;
      const box = document.createElement('div');
      box.id = 'kk-choice';
      box.innerHTML = p.opts.map((o, k) => `<button data-k="${k}">${o}</button>`).join('');
      box.onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        delete T.pending[room];
        box.remove();
        p.res(p.opts[+b.dataset.k]);
      };
      $('app-body').appendChild(box);
      scrollBottom();
    }

    async function runRoom(i) {
      const name = DATA.kakao[i].who;
      const S = SCRIPTS[name];
      if (!S) return;
      await wait(1000);
      for (const t of S.open) await say(i, t);

      const pick = await choose(i, S.choice);
      if (pick !== SILENT) addMsg(i, [DATA.time, 'out', pick]);

      for (const t of (S.after[pick] || [])) {
        await wait(600);
        await say(i, t);
      }

      await wait(900);
      incomingCall(name);
    }


    function openKakao(i) {
      const th = DATA.kakao[i];
      th.unread = 0;
      badges();
      kkMode('room');
      st.app = 'kakao';
      st.view = 'thread';
      st.kk = i;
      $('app-back').textContent = '‹ 목록';
      showScr('s-app');
      $('app-title').textContent = th.group ? `${th.who} (${th.group})` : th.who;

      let html = '';
      th.msgs.forEach((m, k) => {
        const p = th.msgs[k - 1];
        const first = !p || p[0] === 'date' || p[1] !== m[1] || p[3] !== m[3];
        html += rowHtml(m, first, th.group ? m[3] : th.who);
      });

      $('app-body').innerHTML = html;
      $('kk-bar').classList.add('on');
      scrollBottom();

      renderChoice();

      if (SCRIPTS[th.who] && !STARTED[th.who]) {
        STARTED[th.who] = true;
        runRoom(i);
      }
    }


    $('kk-plus').onclick = () => $('kk-menu').classList.toggle('on');

    $('kk-menu').onclick = e => {
      const d = e.target.closest('[data-m]');
      if (!d) return;
      $('kk-menu').classList.remove('on');
      if (d.dataset.m === 'loc') shareLocation();
      else banner('알림', '앨범·카메라는 아직 준비 중이에요', null);
    };

    function shareLocation() {
      const room = DATA.kakao[st.kk];
      if (!room || !PEOPLE[room.who]) return banner('알림', '이 대화방에서는 위치를 보낼 수 없어요', null);
      const who = room.who;
      if (PS.located[who]) return banner('알림', '이미 위치를 공유했어요', null);
      PS.located[who] = true;
      addMsg(st.kk, [DATA.time, 'out', 'loc']);
      if (PS.locRes[who]) {
        PS.locRes[who](true);
        PS.locRes[who] = null;
      }
    }

    function waitLocOrTimeout(who, ms) {
      if (PS.located[who]) return Promise.resolve(true);
      return new Promise(res => {
        const t = setTimeout(() => { PS.locRes[who] = null; res(false); }, ms);
        PS.locRes[who] = ok => { clearTimeout(t); res(ok); };
      });
    }

    function cardSms() {
      const body = '영원카드 32,600원 승인 Uber(택시)';
      DATA.sms.unshift({ who: '영원카드', unread: 1, date: '', msgs: [[DATA.time, 'in', body]] });
      badges();
      banner('영원카드', '32,600원 · Uber(택시)', () => openApp('msg'));
    }

    async function postCall(who) {
      if (PS.post[who]) return;
      PS.post[who] = true;
      const P = PEOPLE[who];
      const i = roomIdx(who);

      await wait(2000);
      for (const t of P.ask) await say(i, t);

      $('kk-plus').classList.add('blink');
      let shared = await waitLocOrTimeout(who, P.nagMs);
      if (!shared) {
        for (const t of P.nag) await say(i, t);
        shared = await waitLocOrTimeout(who, 10000 - P.nagMs);
        if (!shared) for (const t of P.noShare) await say(i, t);
      }
      $('kk-plus').classList.remove('blink');

      if (shared) {
        for (const t of P.shared) { await wait(600); await say(i, t); }
        await wait(900);
        return incomingCall(who, true);
      }

      const pick = await choose(i, P.choice2);
      addMsg(i, [DATA.time, 'out', pick]);

      if (pick === P.choice2[0]) {
        for (const t of P.A) { await wait(600); await say(i, t); }
        markFinished(who);
        return; // 연출만 종료
      }

      for (const t of P.B) { await wait(600); await say(i, t); }
      await wait(900);
      cardSms();
      await wait(900);
      incomingCall(who, true);
    }

    function missedCall(who, second) {
      if (second) return setTimeout(() => incomingCall(who, true), 4000);
      missed(who);
    }

    function missed(who) {
      DATA.missed++;
      badges();
      const P = PEOPLE[who];
      const i = roomIdx(who);
      (async () => {
        await wait(2000);
        for (const t of P.missed) await say(i, t);
      })();
      clearTimeout(PS.cbT[who]);
      PS.cbT[who] = setTimeout(async () => {
        if (PS.called[who]) return;
        for (const t of P.callback) await say(i, t);
      }, 15000);
    }

    function callScreen(view, name) {
      $('c-av').textContent = name[0];
      $('c-av2').textContent = name[0];
      $('c-name').textContent = name;
      $('c-name2').textContent = name;
      $('call-ring').classList.toggle('on', view === 'ring');
      $('call-live').classList.toggle('on', view === 'live');
    }

    function incomingCall(who = '정태을', second = false) {
      if (currentScr() === 's-call') return;
        if (PS.ended) return;
  CALL.second = second;
      const P = PEOPLE[who];
      CALL.who = who;
      CALL.second = second;
      CALL.lines = second ? P.call2 : P.call1;
      CALL.hang = second ? [] : P.hang;
      CALL.prev = ['s-off', 's-boot', 's-lock', 's-call', 's-end'].includes(currentScr()) ? 's-home' : currentScr();
      CALL.out = false;
      CALL.ringing = true;
      CALL.idx = 0; CALL.sec = 0;
      CALL.endingNow = false;
      $('call-ring').classList.remove('outgoing');
      $('c-sub').textContent = '휴대폰';
      callScreen('ring', who);
      showScr('s-call');
      clearTimeout(CALL.ringT);
      CALL.ringT = setTimeout(() => {
        if (!CALL.ringing) return;
        CALL.ringing = false;
        showScr(CALL.prev);
        missedCall(who, second);
      }, 3000);
    }

    function dial(raw) {
      const who = raw.replace(/\s*\(.*\)$/, '');
      const P = PEOPLE[who];
      if (!P || !P.call1 || PS.called[who]) return banner('통화 연결이 되지 않아요', who, null);
      if (currentScr() === 's-call') return;
      clearTimeout(PS.cbT[who]);
      CALL.who = who;
      CALL.second = false;
      CALL.lines = P.call1;
      CALL.hang = P.hang;
      CALL.prev = ['s-off', 's-boot', 's-lock', 's-call', 's-end'].includes(currentScr()) ? 's-home' : currentScr();
      CALL.out = true;
      CALL.ringing = false;
      $('call-ring').classList.add('outgoing');
      $('c-sub').textContent = '발신 중…';
      callScreen('ring', who);
      showScr('s-call');
      CALL.dialT = setTimeout(connectCall, 2000);
    }

    function connectCall() {
      const who = CALL.who;
      PS.called[who] = true;
      clearTimeout(PS.cbT[who]);
      clearTimeout(CALL.ringT);
      CALL.out = false;
      CALL.ringing = false;
      CALL.idx = 0; CALL.sec = 0;
      hanging = false;

      CALL.endingNow = false;

      $('call-ring').classList.remove('outgoing');
      callScreen('live', who);
      showScr('s-call');
      renderLine();
      $('c-timer').textContent = '00:00';
      clearInterval(CALL.iv);
      CALL.iv = setInterval(() => {
        CALL.sec++;
        const m = String(Math.floor(CALL.sec / 60)).padStart(2, '0');
        const s = String(CALL.sec % 60).padStart(2, '0');
        $('c-timer').textContent = m + ':' + s;
      }, 1000);
    }

    function renderLine() {
      $('c-line').textContent = CALL.lines[CALL.idx] || '';
      $('c-end').classList.toggle('dim', CALL.idx < CALL.lines.length - 1);
    }

    let hanging = false;

    function advanceLine() {
      if (CALL.idx < CALL.lines.length - 1) {
        CALL.idx++;
        renderLine();
        return true;
      }
      return false;
    }

    function endCall() {
  clearInterval(CALL.iv);
    $('call-ring').classList.remove('on');
  $('call-live').classList.remove('on');

  clearTimeout(CALL.dialT);
  clearTimeout(CALL.ringT);
  CALL.ringing = false;
  if (CALL.second) return showEnding();
  const back = ['s-off', 's-boot', 's-call', 's-end'].includes(CALL.prev) || !CALL.prev
    ? 's-home' : CALL.prev;
  showScr(back);
  postCall(CALL.who);
}


    $('call-live').onclick = e => {
      if (e.target.closest('#c-end')) return;
      advanceLine();
    };

    $('c-end').onclick = async e => {
      e.stopPropagation();
      if (advanceLine()) return;
      if (hanging) return;
      hanging = true;
      const P = PEOPLE[CALL.who] || {};
      const lines = CALL.second ? [] : (P.hang || []);
      for (const t of lines) {
        $('c-line').textContent = t;
        await wait(1200);
      }
      hanging = false;
      endCall();
    };


    $('c-acc').onclick = () => {
      if (!CALL.ringing) return;
      CALL.ringing = false;
      clearTimeout(CALL.ringT);
      connectCall();
    };

    $('c-dec').onclick = () => {
      if (CALL.out) {
        clearTimeout(CALL.dialT);
        CALL.out = false;
        showScr(CALL.prev);
        return;
      }
      if (!CALL.ringing) return;
      CALL.ringing = false;
      clearTimeout(CALL.ringT);
      showScr(CALL.prev);
      missedCall(CALL.who, CALL.second);
    };

    function advanceLine() {
      if (CALL.idx < CALL.lines.length - 1) {
        CALL.idx++;
        renderLine();
        return true;
      }
      return false;
    }

    function fitPhone() {
      const s = Math.min(1, (innerHeight - 24) / 872);
      $('phone').style.zoom = s;
    }
    addEventListener('resize', fitPhone);
    fitPhone();


    /* ---------- 시작 ---------- */
    clock();
    badges();
    showScr('s-off');
    /* 통화 대사 넘김·끊기 핸들러 (한 곳에서 재등록) */
$('call-live').onclick = e => {
  if (e.target.closest('#c-end')) return;
  if (CALL.idx < CALL.lines.length - 1) {
    CALL.idx++;
    renderLine();
  }
};

$('c-end').onclick = async e => {
  e.stopPropagation();
  if (CALL.idx < CALL.lines.length - 1) {
    CALL.idx = CALL.lines.length - 1;
    renderLine();
    return;
  }
  if (hanging) return;
  hanging = true;
  const P = PEOPLE[CALL.who] || {};
  const lines = CALL.second ? [] : (P.hang || []);
  for (const t of lines) {
    $('c-line').textContent = t;
    await wait(1200);
  }
  hanging = false;
  endCall();
};

    /* 화면 요소를 #screen 바로 아래로 재배치 (HTML 중첩 오류 보정) */
['s-app', 's-call', 's-end'].forEach(id => $('screen').appendChild($(id)));
$('s-end').appendChild($('replay'));
$('screen').appendChild($('banner'));

    function kkMode(m) {
      const s = $('s-app');
      s.classList.remove('kk-list', 'kk-room');
      if (m) s.classList.add('kk-' + m);
      $('status').classList.toggle('light', m === 'list' || m === 'room');
    }
    /* ===== 홈 이동 · 카톡 목록 · 조은섭/조영/이곤 대화방 ===== */
    /*DATA.kakao.push(
      { who: '조은섭', unread: 0, date: '', msgs: [['12:21', 'in', '(대화 내용 대기 중)']] },
      { who: '조영', unread: 0, date: '', msgs: [['12:21', 'in', '(대화 내용 대기 중)']] },
      { who: '이곤', unread: 0, date: '', msgs: [['12:21', 'in', '(대화 내용 대기 중)']] }
    );*/

    function goHome() {
      const cur = currentScr();
      if (['s-off', 's-boot', 's-lock', 's-call'].includes(cur)) return;
      $('kk-menu').classList.remove('on');
      $('s-app').classList.remove('kk-list', 'kk-room');
      st.view = 'none';
            $('status').style.color = '';
      showScr('s-home');
    }

    $('home-zone').onclick = goHome;
    /* ===== 엔딩 · 히든엔딩 ===== */
    Object.assign(PEOPLE, {
      '구서령': {
        ending: 'hidden1',
        hang: [],
        call2: ['강신재 형사님?', '대한제국 구서령입니다', '우리 얼굴 볼까요?'],
      },
    });
    Object.assign(PS, { finished: {}, ended: false, vmOpen: false, hiddenStarted: false });

    function showEnding() {
  if (PS.ended) return;
  PS.ended = true;
  clearInterval(CALL.iv);
  clearTimeout(CALL.dialT);
  clearTimeout(CALL.ringT);
  document.querySelectorAll('#screen > .scr').forEach(s => s.classList.toggle('on', s.id === 's-end'));
}
$('replay').onclick = () => location.reload();

    function markFinished(who) {
      PS.finished[who] = true;
      checkHidden();
    }

    function checkHidden() {
      if (PS.ended || PS.hiddenStarted) return;
      const people = Object.keys(PEOPLE).filter(w => w !== '구서령');
      if (!people.every(w => PS.finished[w])) return;
      PS.hiddenStarted = true;
      // 10초 후 음성사서함 오픈
      setTimeout(() => {
        if (PS.ended) return;
        PS.vmOpen = true;
        if (st.app === 'phone' && st.view === 'list' && currentScr() === 's-app') openApp('phone');
      }, 10000);
      // 1분 30초 후 구서령 전화
      setTimeout(hiddenCall, 90000);
    }

    function hiddenCall() {
      if (PS.ended) return;
      if (currentScr() === 's-call') return setTimeout(hiddenCall, 3000);
      incomingCall('구서령', true);
    }

    function vmRow() {
      return `<div class="row" data-act="vm" style="${PS.vmOpen ? '' : 'opacity:.35'}">
    <div style="min-width:0"><div class="rt">음성사서함</div><div class="rs">${PS.vmOpen ? '새 음성 메시지' : ''}</div></div>
  </div>`;
    }

    function openVoicemail() {
      if (!PS.vmOpen) return;
      st.app = 'phone';
      st.view = 'thread';
      kkMode(null);
      $('app-back').textContent = '‹ 목록';
      $('kk-bar').classList.remove('on');
      $('kk-menu').classList.remove('on');
      showScr('s-app');
      $('app-title').textContent = '음성사서함';
      $('app-body').innerHTML = `
    <div class="sep">음성메시지</div>
    <div style="padding:24px 0;text-align:center">
      <div style="font-size:15px;margin-bottom:14px">발신: 알 수 없음</div>
      <audio id="vm-audio" controls src="voicemail.mp3" style="width:100%"></audio>
    </div>`;
      $('vm-audio').onended = () => showEnding();
    }


  </script>
